name: Build Unsigned iOS IPA for Sideloadly

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Patch Swift Tools Version for Xcode 16 Compatibility
        run: node scripts/fix-swift-tools.js

      - name: Expo Prebuild (Generate iOS Native Project)
        env:
          EXPO_USE_PRECOMPILED_MODULES: '0'
        run: npx expo prebuild --platform ios --clean

      - name: Re-patch Swift Tools Version after Prebuild
        run: node scripts/fix-swift-tools.js

      - name: Install CocoaPods Dependencies
        env:
          EXPO_USE_PRECOMPILED_MODULES: '0'
        run: |
          cd ios
          pod install --repo-update

      - name: Re-patch Swift Files after CocoaPods
        run: node scripts/fix-swift-tools.js

      - name: Build iOS Application Archive (Unsigned)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Found workspace: $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "MusicPlayer" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .app into .ipa for Sideloadly / AltStore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/derivedData" -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app package was found in derivedData!"
            exit 1
          fi
          cp -r "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"
          cd "$GITHUB_WORKSPACE/build"
          zip -r MusicPlayer.ipa Payload

      - name: Upload MusicPlayer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-iOS-IPA
          path: build/MusicPlayer.ipa
          retention-days: 14
